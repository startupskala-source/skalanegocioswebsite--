<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skala — Marketing com teste/title>
  <style>
    /* ========== RESET E VARIÁVEIS ========== */
    :root {
      --ink: #06111f;
      --muted: #58687b;
      --muted2: #8190a2;
      --bg: #f8fbff;
      --orange: #ff8a1f;
      --blue: #1d8cff;
      --line: rgba(6, 17, 31, .1);
      --glass: rgba(255, 255, 255, .64);
      --r: 28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    /* ========== BACKGROUND GERAL ========== */
    .site {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 9% 20%, rgba(255, 138, 31, .10), transparent 25%), radial-gradient(circle at 90% 58%, rgba(29, 140, 255, .10), transparent 26%), linear-gradient(180deg, #fff 0%, #f8fbff 52%, #fff 100%);
    }

    .site:before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(6, 17, 31, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 17, 31, .035) 1px, transparent 1px);
      background-size: 120px 120px;
      opacity: .55;
      mask-image: linear-gradient(to bottom, #000, transparent 60%);
      pointer-events: none;
    }

    .orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(86px);
      opacity: .075;
      pointer-events: none;
    }

    .orb.one { left: -150px; top: 140px; background: var(--orange); }
    .orb.two { right: -160px; top: 760px; background: var(--blue); }

    /* ========== CONTAINER E HEADER ========== */
    .container {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 18px 0;
    }

    .nav {
      height: 60px;
      padding: 0 12px 0 20px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .42));
      backdrop-filter: blur(24px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 11px; font-size: 13px; letter-spacing: .17em; text-transform: uppercase; font-weight: 850; min-width: 132px; }
    .nav-logo-img { display: block; width: 118px; height: auto; object-fit: contain; mix-blend-mode: multiply; }
    .menu { display: flex; gap: 34px; color: #43546a; font-size: 12px; }
    .menu a { transition: .24s; }
    .menu a:hover { color: var(--orange); }
    .nav-actions { display: flex; gap: 10px; }
    .btn {
      height: 42px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; color: var(--ink); font-size: 12px; font-weight: 760; isolation: isolate;
      border: 1px solid rgba(6, 17, 31, .1); transition: .25s; white-space: nowrap;
    }
    .btn span { position: relative; z-index: 2; }
    .btn:hover { transform: translateY(-1px); border-color: rgba(6, 17, 31, .16); }
    .btn-ghost { background: linear-gradient(135deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .26)); backdrop-filter: blur(22px) saturate(165%); }
    .btn-primary { background: linear-gradient(135deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .2)), linear-gradient(135deg, rgba(255, 138, 31, .82), rgba(29, 140, 255, .22)); border-color: rgba(255, 255, 255, .64); backdrop-filter: blur(22px) saturate(165%); }
    .btn:before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(120deg, rgba(255, 255, 255, .95), rgba(255, 138, 31, .38), rgba(29, 140, 255, .26), rgba(255, 255, 255, .78));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; z-index: 1;
    }
    .btn:after {
      content: ""; position: absolute; top: -140%; left: -60%; width: 46%; height: 380%; transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .64), transparent); opacity: .36;
      animation: glassSweep 5.2s ease-in-out infinite; z-index: 1;
    }
    @keyframes glassSweep { 0%, 100% { left: -65%; opacity: 0; } 18% { opacity: .4; } 44% { left: 118%; opacity: 0; } }

    .mobile-toggle { display: none; width: 42px; height: 42px; border-radius: 999px; color: var(--ink); background: rgba(255, 255, 255, .62); border: 1px solid var(--line); }
    .mobile-menu { display: none; }

    /* ========== HERO ========== */
    .hero { padding: 70px 0 90px; text-align: center; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, .72); border: 1px solid var(--line); color: var(--muted); font-size: 12px; margin-bottom: 22px; backdrop-filter: blur(18px) saturate(145%); animation: fadeUp .75s both; }
    .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
    .hero h1 { max-width: 1040px; font-size: clamp(54px, 8.1vw, 118px); line-height: .88; letter-spacing: -.085em; font-weight: 540; text-wrap: balance; animation: fadeUp .75s .08s both; }
    .hero h1 span, .quote span, .cta-card h2 span { background: linear-gradient(120deg, var(--ink), var(--orange) 46%, var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; }
    .hero-copy { max-width: 680px; margin-top: 34px; color: var(--muted); font-size: 17px; line-height: 1.75; animation: fadeUp .75s .16s both; }
    .hero-copy strong { color: var(--ink); font-weight: 650; }
    .hero-actions { margin-top: 38px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; animation: fadeUp .75s .24s both; }
    .hero-actions .btn { height: 56px; padding: 0 32px; font-size: 14px; }
    .trust-row { margin-top: 30px; display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; color: var(--muted2); font-size: 12px; animation: fadeUp .75s .32s both; }
    .trust-row span { display: inline-flex; align-items: center; gap: 8px; }
    .trust-row b { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255, 138, 31, .4); color: var(--orange); font-size: 9px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

    /* ========== MARQUEE ========== */
    .marquee-wrap { position: relative; z-index: 2; padding: 34px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; background: rgba(255, 255, 255, .56); backdrop-filter: blur(18px) saturate(150%); }
    .marquee { display: flex; width: max-content; gap: 46px; color: var(--ink); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 820; animation: marquee 26s linear infinite; }
    .marquee span { display: inline-flex; align-items: center; gap: 46px; }
    .marquee span:after { content: "✦"; color: var(--orange); font-size: 12px; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* ========== SECTIONS GERAIS ========== */
    .section { padding: 110px 0; position: relative; z-index: 2; }
    .section-head { display: grid; grid-template-columns: 1fr .85fr; gap: 70px; align-items: start; margin-bottom: 54px; }
    .kicker { display: inline-flex; align-items: center; gap: 10px; color: var(--orange); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 820; margin-bottom: 18px; }
    .kicker:before { content: ""; width: 28px; height: 1px; background: var(--orange); }
    .section-title { max-width: 780px; font-size: clamp(38px, 5vw, 72px); line-height: .96; letter-spacing: -.065em; font-weight: 540; text-wrap: balance; }
    .section-title strong { background: linear-gradient(110deg, var(--ink), var(--orange), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: inherit; }
    .section-text { color: var(--muted); font-size: 15px; line-height: 1.75; max-width: 480px; }

    /* ========== CARDS ========== */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { position: relative; min-height: 520px; padding: 34px 34px 30px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .46)); backdrop-filter: blur(18px) saturate(145%); overflow: hidden; transition: .28s; }
    .card:hover { transform: translateY(-2px); border-color: rgba(6, 17, 31, .14); }
    .card-number { display: block; background: linear-gradient(110deg, var(--orange), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 13px; line-height: 1; margin-bottom: 56px; }
    .card h3 { min-height: 72px; max-width: 360px; color: var(--ink); font-size: 24px; line-height: 1.05; letter-spacing: -.035em; font-weight: 650; margin-bottom: 18px; }
    .card p { max-width: 360px; min-height: 118px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .data-flow, .mini-chart { position: absolute; left: 34px; right: 34px; bottom: 40px; height: 176px; pointer-events: none; }
    .data-flow { display: grid; grid-template-columns: 48px 1fr 86px; align-items: center; gap: 20px; }
    .data-icons { display: grid; gap: 12px; z-index: 2; }
    .data-icon { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); background: rgba(255, 255, 255, .64); border: 1px solid var(--line); font-size: 13px; }
    .flow-lines { width: 100%; height: 144px; overflow: visible; }
    .flow-lines path { stroke: url(#flowGradient); stroke-width: 1.15; stroke-dasharray: 2 7; opacity: .75; animation: dashFlow 2.8s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -28; } }
    .flow-core { width: 78px; height: 78px; border-radius: 24px; display: grid; place-items: center; color: var(--ink); font-size: 24px; background: linear-gradient(135deg, rgba(255, 255, 255, .82), rgba(255, 138, 31, .62)); border: 1px solid var(--line); }
    .mini-chart { display: flex; align-items: flex-end; justify-content: center; }
    .mini-chart:before { content: ""; position: absolute; inset: 16px 0 20px; background-image: linear-gradient(rgba(6, 17, 31, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 17, 31, .035) 1px, transparent 1px); background-size: 52px 38px; mask-image: linear-gradient(to right, transparent, #000 14%, #000 88%, transparent); }
    .mini-chart svg { width: 100%; height: 132px; position: relative; z-index: 2; }
    .growth-tag { position: absolute; top: 16px; right: 20px; z-index: 3; padding: 8px 14px; border-radius: 999px; color: #06111f; font-size: 12px; font-weight: 860; letter-spacing: -.01em; background: linear-gradient(135deg, rgba(255, 255, 255, .86), rgba(255, 255, 255, .48)), linear-gradient(135deg, rgba(255, 138, 31, .22), rgba(29, 140, 255, .14)); border: 1px solid rgba(255, 138, 31, .26); transform-origin: center; animation: growthPop .95s cubic-bezier(.16, 1, .3, 1) .35s both; }
    .growth-tag span { display: inline-block; min-width: 28px; font-size: 18px; line-height: 1; background: linear-gradient(110deg, var(--orange), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes growthPop { 0% { opacity: 0; transform: translateY(10px) scale(.72); filter: blur(5px); } 62% { opacity: 1; transform: translateY(0) scale(1.18); filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    .radar { position: absolute; left: 50%; bottom: 34px; width: 214px; height: 214px; border-radius: 50%; transform: translateX(-50%); pointer-events: none; border: 1px solid rgba(6, 17, 31, .10); background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .92) 0 9%, transparent 10%), radial-gradient(circle at 50% 50%, transparent 0 24%, rgba(255, 138, 31, .10) 25% 26%, transparent 27% 43%, rgba(29, 140, 255, .12) 44% 45%, transparent 46% 63%, rgba(6, 17, 31, .08) 64% 65%, transparent 66%), linear-gradient(90deg, transparent 49.5%, rgba(6, 17, 31, .08) 50%, transparent 50.5%), linear-gradient(0deg, transparent 49.5%, rgba(6, 17, 31, .08) 50%, transparent 50.5%), radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .72), rgba(255, 255, 255, .28)); box-shadow: inset 0 0 0 10px rgba(255, 255, 255, .34); overflow: hidden; }
    .radar:before { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 1; background: conic-gradient(from -18deg, rgba(255, 138, 31, .44), rgba(29, 140, 255, .18) 20%, transparent 34% 100%); mix-blend-mode: multiply; animation: radarSpin 3.8s linear infinite; }
    @keyframes radarSpin { to { transform: rotate(360deg); } }
    .radar:after { content: ""; position: absolute; inset: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(255, 138, 31, .18); background: radial-gradient(circle, rgba(255, 138, 31, .14), transparent 64%); box-shadow: 0 0 0 18px rgba(29, 140, 255, .035); }
    .radar-point { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #06111f; z-index: 3; box-shadow: 0 0 0 6px rgba(255, 138, 31, .12), 0 0 20px rgba(255, 138, 31, .28); animation: radarPing 2.4s ease-in-out infinite; }
    .p1 { left: 32px; top: 104px; }
    .p2 { right: 34px; top: 62px; background: var(--blue); box-shadow: 0 0 0 6px rgba(29, 140, 255, .12), 0 0 20px rgba(29, 140, 255, .26); animation-delay: .4s; }
    .p3 { left: 104px; top: 26px; background: var(--orange); animation-delay: .8s; }
    @keyframes radarPing { 0%, 100% { transform: scale(.92); opacity: .72; } 50% { transform: scale(1.35); opacity: 1; } }
    .shield { position: absolute; inset: 0; display: grid; place-items: center; color: #06111f; font-size: 28px; z-index: 4; text-shadow: 0 6px 22px rgba(255, 138, 31, .18); }

    /* ========== PROCESSO ========== */
    .process { display: grid; grid-template-columns: .85fr 1.15fr; gap: 60px; align-items: start; }
    .sticky-copy { position: sticky; top: 120px; }
    .steps { display: grid; gap: 16px; }
    .step { min-height: 145px; padding: 28px; border-radius: 24px; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .44)); display: grid; grid-template-columns: 52px 1fr; gap: 20px; transition: .28s; }
    .step:hover { transform: translateX(4px); border-color: rgba(6, 17, 31, .14); }
    .step b { width: 52px; height: 52px; border-radius: 17px; display: grid; place-items: center; color: var(--ink); background: linear-gradient(135deg, rgba(255, 255, 255, .76), rgba(255, 255, 255, .2)), linear-gradient(135deg, rgba(255, 138, 31, .76), rgba(29, 140, 255, .18)); border: 1px solid rgba(6, 17, 31, .08); }
    .step h3 { font-size: 20px; letter-spacing: -.03em; margin-bottom: 10px; }
    .step p { color: var(--muted); font-size: 14px; line-height: 1.7; }

    /* ========== PROOF ========== */
    .proof { padding: 120px 0; }
    .proof-box { padding: 56px; border-radius: 36px; border: 1px solid var(--line); background: radial-gradient(circle at 18% 20%, rgba(255, 138, 31, .1), transparent 26%), radial-gradient(circle at 85% 80%, rgba(29, 140, 255, .1), transparent 28%), linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .44)); }
    .proof-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 60px; align-items: center; }
    .quote { font-size: clamp(32px, 4.2vw, 62px); line-height: 1; letter-spacing: -.06em; font-weight: 540; text-wrap: balance; }
    .metrics { display: grid; gap: 14px; }
    .metric { padding: 22px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255, 255, 255, .6); }
    .metric strong { display: block; background: linear-gradient(110deg, var(--orange), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 42px; letter-spacing: -.055em; line-height: 1; margin-bottom: 8px; }
    .metric p { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* ========== STATUS SECTION ========== */
    .status-section { position: relative; z-index: 3; padding: 74px 0 34px; }
    .status-panel { border-radius: 38px; border: 1px solid rgba(6, 17, 31, .09); background: radial-gradient(circle at 15% 20%, rgba(255, 138, 31, .10), transparent 28%), radial-gradient(circle at 86% 64%, rgba(29, 140, 255, .10), transparent 30%), linear-gradient(135deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .42)); backdrop-filter: blur(22px) saturate(155%); padding: 38px 28px 34px; overflow: hidden; }
    .status-head { max-width: 760px; margin: 0 auto 30px; text-align: center; }
    .status-title { color: var(--ink); font-size: clamp(34px, 4.4vw, 62px); line-height: .95; letter-spacing: -.06em; font-weight: 540; text-wrap: balance; }
    .status-head p { max-width: 610px; margin: 20px auto 0; color: var(--muted); font-size: 15px; line-height: 1.72; }
    .status-cloud { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px 16px; }
    .status-pill {
      --pill-main: #ff8a1f; --pill-soft: rgba(255, 138, 31, .13);
      min-height: 42px; padding: 0 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 9px;
      color: #06111f; font-size: 14px; font-weight: 690; letter-spacing: -.01em;
      border: 1px solid color-mix(in srgb, var(--pill-main) 42%, transparent);
      background: linear-gradient(135deg, rgba(255, 255, 255, .72), rgba(255, 255, 255, .22)), linear-gradient(135deg, var(--pill-soft), rgba(255, 255, 255, .10));
      backdrop-filter: blur(18px) saturate(160%); position: relative; overflow: hidden; transition: transform .22s ease;
    }
    .status-pill:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--pill-main) 62%, transparent); }
    .status-pill::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(120deg, rgba(255, 255, 255, .94), color-mix(in srgb, var(--pill-main) 42%, transparent), rgba(255, 255, 255, .76));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    .status-pill i { width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; font-style: normal; font-size: 12px; color: #06111f; background: color-mix(in srgb, var(--pill-main) 32%, white); border: 1px solid rgba(255, 255, 255, .58); }
    .status-pill.blue { --pill-main: #1d8cff; --pill-soft: rgba(29, 140, 255, .13); }
    .status-pill.blue-soft { --pill-main: #56b8ff; --pill-soft: rgba(86, 184, 255, .13); }
    .status-pill.orange { --pill-main: #ff8a1f; --pill-soft: rgba(255, 138, 31, .14); }
    .status-pill.orange-soft { --pill-main: #ff9b4a; --pill-soft: rgba(255, 155, 74, .13); }
    .status-pill.done { --pill-main: #1d8cff; --pill-soft: rgba(29, 140, 255, .11); }
    .status-pill.neutral { --pill-main: #9aa8b8; --pill-soft: rgba(154, 168, 184, .14); }

    /* ========== FORMULÁRIO SKALA (DUAS COLUNAS) ========== */
    .super-form-section { position: relative; z-index: 3; padding: 120px 0 76px; }
    .skala-login-stage {
      position: relative; min-height: 720px; padding: 54px; border-radius: 44px; overflow: hidden;
      display: grid; grid-template-columns: .95fr 1.05fr; gap: 46px; align-items: center;
      border: 1px solid rgba(6, 17, 31, .10);
      background: radial-gradient(circle at 12% 18%, rgba(255, 138, 31, .14), transparent 28%), radial-gradient(circle at 90% 72%, rgba(29, 140, 255, .14), transparent 32%), linear-gradient(135deg, rgba(255,255,255,.84), rgba(255,255,255,.44));
      backdrop-filter: blur(24px) saturate(155%);
    }
    .skala-login-stage::before {
      content: ""; position: absolute; inset: 22px; border-radius: 34px;
      background: linear-gradient(rgba(6, 17, 31, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 17, 31, .035) 1px, transparent 1px);
      background-size: 74px 74px; mask-image: radial-gradient(circle at 70% 50%, #000, transparent 70%); pointer-events: none;
    }
    .skala-form-copy { position: relative; z-index: 2; max-width: 500px; }
    .skala-form-copy h2 { margin-top: 18px; font-size: clamp(40px, 4.8vw, 74px); line-height: .92; letter-spacing: -.07em; font-weight: 540; text-wrap: balance; }
    .skala-form-copy h2 span { background: linear-gradient(120deg, var(--ink), var(--orange) 48%, var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; }
    .skala-form-copy p { max-width: 460px; margin-top: 24px; color: var(--muted); font-size: 15px; line-height: 1.78; }
    .skala-form-badges { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 10px; }
    .skala-form-badges span { min-height: 38px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; color: var(--ink); font-size: 12px; font-weight: 720; border: 1px solid rgba(6, 17, 31, .09); background: rgba(255, 255, 255, .64); backdrop-filter: blur(16px); }

    .skala-access-card {
      position: relative; z-index: 2; width: min(510px, 100%); margin-left: auto; padding: 42px 42px 34px;
      border-radius: 30px; color: #fff; overflow: hidden; border: 1px solid rgba(255, 255, 255, .18);
      background: radial-gradient(circle at 8% 2%, rgba(255, 138, 31, .34), transparent 28%), radial-gradient(circle at 94% 14%, rgba(29, 140, 255, .18), transparent 34%), radial-gradient(circle at 78% 90%, rgba(29, 140, 255, .14), transparent 38%), linear-gradient(145deg, rgba(22, 25, 30, .92), rgba(7, 9, 13, .88));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 30px 90px rgba(6, 17, 31, .22);
      backdrop-filter: blur(28px) saturate(155%); isolation: isolate;
    }
    .skala-access-card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(120deg, rgba(255,255,255,.16), transparent 34%, rgba(255,255,255,.07) 70%, transparent), linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size: auto, 58px 58px, 58px 58px; pointer-events: none; z-index: -1;
    }
    .skala-access-card::after { content: ""; position: absolute; inset: 1px; border-radius: 29px; border: 1px solid rgba(255,255,255,.07); pointer-events: none; }
    .access-glow { position: absolute; width: 220px; height: 220px; left: -80px; top: -92px; border-radius: 50%; background: linear-gradient(135deg, rgba(255, 138, 31, .52), rgba(29, 140, 255, .34)); filter: blur(42px); opacity: .86; pointer-events: none; animation: accessGlow 5.5s ease-in-out infinite; }
    @keyframes accessGlow { 0%,100% { transform: scale(.94); opacity: .68; } 50% { transform: scale(1.12); opacity: .98; } }
    .access-header { position: relative; z-index: 2; text-align: center; margin-bottom: 26px; }

    .access-header small { display: block; margin-top: 7px; color: rgba(255,255,255,.48); font-size: 12px; }

    /* FORMULÁRIO EM DUAS COLUNAS */

      min-height: 56px; border-radius: 999px; padding: 22px 19px 9px; color: rgba(255,255,255,.92); font-size: 13px;

    .access-bottom-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 4px 0 0; color: rgba(255,255,255,.32); font-size: 10px; font-style: normal; }

    /* ========== MODAL DE SUCESSO ========== */
    .success-overlay { position: fixed !important; inset: 0 !important; z-index: 9999 !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 20px !important; background: rgba(255, 255, 255, .18) !important; backdrop-filter: blur(8px) saturate(120%) !important; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .24s ease, visibility .24s ease !important; }

    .success-modal { position: relative !important; width: min(460px, 100%) !important; padding: 28px 26px 24px !important; border-radius: 28px !important; color: var(--ink) !important; border: 1px solid rgba(6, 17, 31, .10) !important; background: rgba(255, 255, 255, .88) !important; box-shadow: 0 26px 70px rgba(6, 17, 31, .14), inset 0 1px 0 rgba(255,255,255,.94) !important; backdrop-filter: blur(26px) saturate(150%) !important; transform: translateY(14px) scale(.98); opacity: 0; transition: transform .34s cubic-bezier(.16, 1, .3, 1), opacity .24s ease !important; isolation: isolate !important; text-align: center; }
    .success-overlay.active .success-modal { transform: translateY(0) scale(1) !important; opacity: 1 !important; }
    .success-close { position: absolute !important; top: 14px !important; right: 14px !important; width: 34px !important; height: 34px !important; border-radius: 999px !important; display: grid !important; place-items: center !important; color: rgba(6, 17, 31, .58) !important; background: rgba(6, 17, 31, .035) !important; border: 1px solid rgba(6, 17, 31, .06) !important; transition: transform .2s ease, background .2s ease !important; cursor: pointer; }
    .success-close:hover { transform: rotate(90deg) !important; background: rgba(6, 17, 31, .07) !important; }
    .success-icon { width: 58px !important; height: 58px !important; margin: 0 auto 14px; border-radius: 999px !important; display: grid !important; place-items: center !important; border: 1px solid rgba(255, 138, 31, .22) !important; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.90), rgba(255,255,255,.25) 32%, transparent 64%), linear-gradient(135deg, rgba(255, 138, 31, .12), rgba(29, 140, 255, .10)) !important; box-shadow: 0 14px 34px rgba(29, 140, 255, .12) !important; }
    .success-icon span { width: 31px !important; height: 31px !important; border-radius: 999px !important; display: grid !important; place-items: center !important; color: #fff !important; font-size: 15px !important; font-weight: 850 !important; background: radial-gradient(circle at 32% 18%, rgba(255,255,255,.58), transparent 34%), linear-gradient(135deg, #ff8a1f, #1d8cff) !important; box-shadow: 0 10px 20px rgba(29, 140, 255, .18), inset 0 1px 0 rgba(255,255,255,.32) !important; }
    .success-content h3 { color: var(--ink) !important; font-size: clamp(28px, 5vw, 38px) !important; line-height: 1.04 !important; letter-spacing: -.045em !important; font-weight: 680 !important; margin: 0 0 10px !important; }

      .section-head, .process, .proof-grid, .footer-grid { grid-template-columns: 1fr; gap: 34px; }
      .cards { grid-template-columns: 1fr; }
      .proof-box { padding: 34px; }

    }
    @media(max-width:680px) {

    }
    @media(max-width:560px) {

      .hero h1 { font-size: 54px; }
      .hero-copy { font-size: 15px; }
      .hero-actions, .hero-actions .btn { width: 100%; }
      .section-title { font-size: 42px; }
      .card { min-height: auto; padding: 28px 24px; }

      .skala-login-stage { padding: 18px; border-radius: 32px; }
      .skala-access-card { padding: 34px 18px 24px; border-radius: 26px; }

    <section class="section reveal" id="problema">
      <div class="section-head">
        <div>
          <span class="kicker">O problema</span>
          <h2 class="section-title">Postar bonito não é <strong>estratégia</strong>. É só barulho organizado.</h2>
        </div>
        <p class="section-text">O mercado está cheio de marcas fazendo conteúdo sem direção, anúncios sem narrativa e ofertas sem desejo. O resultado? Muito esforço, pouca percepção de valor e vendas travadas.</p>
      </div>
      <div class="cards">
        <article class="card">
          <span class="card-number">01</span>
          <h3>Você aparece, mas não é lembrado.</h3>
          <p>Presença sem posicionamento vira ruído. A pessoa vê, passa e esquece. Marca forte precisa ocupar um lugar claro na mente do cliente.</p>
          <div class="data-flow">
            <div class="data-icons">

          <h3>Você vende, mas não cria desejo.</h3>
          <p>Oferta sem narrativa vira preço. When a marca não educa o olhar do cliente, ela acaba competindo por desconto.</p>

    <section class="section reveal" id="metodo">
      <div class="process">
        <div class="sticky-copy">
          <span class="kicker">Método Skala</span>
          <h2 class="section-title">Menos achismo. Mais <strong>máquina.</strong></h2>
          <p class="section-text" style="margin-top:24px">A gente não começa pelo post. Começa pela verdade da marca, pela promessa, pela oferta e pelo caminho que transforma atenção em venda.</p>
        </div>
        <div class="steps">
          <article class="step"><b>1</b><div><h3>Diagnóstico sem maquiagem</h3><p>Entendemos onde sua marca perde força: comunicação, oferta, percepção, funil, conteúdo e experiência.</p></div></article>
          <article class="step"><b>2</b><div><h3>Posicionamento que corta o ruído</h3><p>Criamos uma mensagem clara para sua marca parar de tentar agradar todo mundo e começar a atrair quem realmente compra.</p></div></article>
          <article class="step"><b>3</b><div><h3>Conteúdo com função comercial</h3><p>Cada criativo tem um papel: chamar atenção, quebrar objeção, gerar desejo, educar ou vender.</p></div></article>
          <article class="step"><b>4</b><div><h3>Execução, leitura e ajuste</h3><p>Publicamos, analisamos, corrigimos e melhoramos. Crescimento não é chute. É repetição inteligente.</p></div></article>
        </div>
      </div>
    </section>

<script>
  (function(){
    // Mobile menu
    const toggle = document.getElementById('mobileToggle'), menu = document.getElementById('mobileMenu');
    if(toggle && menu){
      toggle.addEventListener('click',()=>{menu.classList.toggle('active'); toggle.textContent = menu.classList.contains('active') ? '×' : '☰';});
      document.querySelectorAll('.mobile-menu a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('active'); toggle.textContent = '☰';}));
    }
    // Reveal
    const reveals = document.querySelectorAll('.reveal');
    function revealCheck(){ reveals.forEach(el=>{ if(el.getBoundingClientRect().top < window.innerHeight-120) el.classList.add('active'); }); }
    window.addEventListener('scroll',revealCheck); revealCheck();
    // Copy logo to footer
    const footerLogo = document.querySelector('[data-copy-logo="nav"]'), navLogo = document.querySelector('.nav-logo-img');
    if(footerLogo && navLogo) footerLogo.src = navLogo.src;
    // Counters
    const counters = document.querySelectorAll('[data-count]');
    function animateCounter(c){
      if(c.dataset.done) return;
      c.dataset.done = 'true';
      const target = Number(c.dataset.count) || 0, duration = target > 100 ? 1350 : 900, start = performance.now();
      function frame(now){
        const p = Math.min(1, (now-start)/duration), eased = 1 - Math.pow(1-p,3);
        c.textContent = Math.round(target * eased);
        if(p<1) requestAnimationFrame(frame); else c.textContent = target;
      }
      requestAnimationFrame(frame);
    }
    if('IntersectionObserver' in window){
      const obs = new IntersectionObserver(entries=>{ entries.forEach(e=>{ if(e.isIntersecting){ animateCounter(e.target); obs.unobserve(e.target); } }); }, { threshold:0.45 });
      counters.forEach(c=>obs.observe(c));
    } else counters.forEach(animateCounter);
    // Animated line
    const line = document.querySelector('.animated-line');
    if(line){ const len = line.getTotalLength(); line.style.strokeDasharray = len; line.style.strokeDashoffset = len; setTimeout(()=>{ line.style.transition = 'stroke-dashoffset 2.2s ease'; line.style.strokeDashoffset = '0'; },700); }
    // Form + modal
    const form = document.getElementById('leadForm'), overlay = document.getElementById('successOverlay'), closeBtn = document.getElementById('successClose'), backBtn = document.getElementById('successBackBtn'), whatsappBtn = document.getElementById('successWhatsappBtn');
    let lastLead = null;
    function closeModal(){ if(overlay){ overlay.classList.remove('active'); overlay.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; } }
    function openModal(lead){
      lastLead = lead;
      if(overlay){ overlay.classList.add('active'); overlay.setAttribute('aria-hidden','false'); document.body.style.overflow = 'hidden'; }
      if(whatsappBtn && lead){
        const phone = lead.whatsapp.replace(/\D/g,'');
        const message = encodeURIComponent(`Olá, Skala! Acabei de enviar minha aplicação estratégica.\n\nNome: ${lead.nome}\nWhatsApp: ${lead.whatsapp}\nMarca: ${lead.marca}\nObjetivo: ${lead.objetivo}\n\nCenário Atual: ${lead.mensagem}`);
        whatsappBtn.href = `https://wa.me/55${phone}?text=${message}`;
      }
    }
    if(overlay) overlay.addEventListener('click',(e)=>{ if(e.target === overlay) closeModal(); });
    if(closeBtn) closeBtn.addEventListener('click',closeModal);
    if(backBtn) backBtn.addEventListener('click',closeModal);
    document.addEventListener('keydown',(e)=>{ if(e.key === 'Escape') closeModal(); });
    if(form){
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const data = new FormData(form);
        const lead = { nome: data.get('nome')||'', whatsapp: data.get('whatsapp')||'', marca: data.get('marca')||'', objetivo: data.get('objetivo')||'', mensagem: data.get('mensagem')||'', origem:'Landing Page Skala', createdAt: new Date().toISOString() };
        // Se quiser integrar com CRM, descomente abaixo e insira a URL
        // const webhookURL = ''; if(webhookURL) await fetch(webhookURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)});
        openModal(lead);
        form.reset();
      });
    }
  })();
</script>
